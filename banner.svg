<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 120" fill="none">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="50%" stop-color="#2a1a1a"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff4444" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ff4444" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#ff4444" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff4444" stop-opacity="0"/>
      <stop offset="20%" stop-color="#ff4444" stop-opacity="0.6"/>
      <stop offset="80%" stop-color="#ff4444" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#ff4444" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="120" fill="url(#bg)"/>
  <rect y="90" width="1200" height="30" fill="url(#accent)"/>

  <!-- Decorative dots -->
  <circle cx="979" cy="101" r="1" fill="#ff4444" opacity="0.03"/>
<circle cx="958" cy="92" r="2" fill="#ff4444" opacity="0.04"/>
<circle cx="937" cy="83" r="3" fill="#ff4444" opacity="0.05"/>
<circle cx="916" cy="74" r="1" fill="#ff4444" opacity="0.06"/>
<circle cx="895" cy="65" r="2" fill="#ff4444" opacity="0.07"/>
<circle cx="874" cy="56" r="3" fill="#ff4444" opacity="0.03"/>
<circle cx="853" cy="47" r="1" fill="#ff4444" opacity="0.04"/>
<circle cx="832" cy="38" r="2" fill="#ff4444" opacity="0.05"/>
<circle cx="811" cy="29" r="3" fill="#ff4444" opacity="0.06"/>
<circle cx="790" cy="20" r="1" fill="#ff4444" opacity="0.07"/>
<circle cx="769" cy="11" r="2" fill="#ff4444" opacity="0.03"/>
<circle cx="748" cy="102" r="3" fill="#ff4444" opacity="0.04"/>


  <!-- Accent line -->
  <line x1="0" y1="118" x2="1200" y2="118" stroke="url(#line)" stroke-width="2"/>

  <!-- Icon -->
  <g color="#ff4444">
    <g transform="translate(75,35) scale(1)" opacity="0.12">
      <rect x="0" y="15" width="15" height="25" fill="currentColor"/>
      <polygon points="15,15 35,0 35,55 15,40" fill="currentColor" opacity="0.7"/>
      <path d="M42,12 Q55,27 42,42" fill="none" stroke="currentColor" stroke-width="2.5"/>
      <path d="M48,5 Q68,27 48,50" fill="none" stroke="currentColor" stroke-width="2.5"/>
      <path d="M54,-2 Q80,27 54,56" fill="none" stroke="currentColor" stroke-width="2.5"/>
    </g>
  </g>

  <!-- Title -->
  <text x="600" y="52" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="32" font-weight="700" fill="#e6edf3" text-anchor="middle" letter-spacing="1">ARS Noise Measurement</text>

  <!-- Subtitle -->
  <text x="600" y="78" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="14" fill="#8b949e" text-anchor="middle" letter-spacing="0.5">Automated drone propulsion noise measurement system</text>
</svg>